[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onsetkit"
version = "0.2.0"
description = "Event-onset labels, optimal stratified sampling and temporal validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]
authors = [{name = "Jaskaran Singh"}]
maintainers = [{name = "Jaskaran Singh"}]
keywords = ["rare-events", "time-series", "regime-shifts", "stratified-sampling", "quantitative-finance"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.urls]
Repository = "https://github.com/jaskaran04/onsetkit"
Issues = "https://github.com/jaskaran04/onsetkit/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
